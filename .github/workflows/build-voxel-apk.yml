name: Build Voxel World APK

on:
  push:
    branches: [voxel-mobile-apk]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot Android environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi
          if [ -d /root/.local/share/godot/export_templates/4.4.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/
          fi
          test -f ~/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          test -f ~/.local/share/godot/export_templates/4.4.1.stable/android_release.apk

      - name: Import project
        run: godot --headless --path voxel-mobile-apk --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p voxel-mobile-apk/build
          godot --headless --path voxel-mobile-apk --export-debug "Android" build/VoxelWorld.apk
          test -f voxel-mobile-apk/build/VoxelWorld.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelWorld-Android-APK
          path: voxel-mobile-apk/build/VoxelWorld.apk
          if-no-files-found: error
