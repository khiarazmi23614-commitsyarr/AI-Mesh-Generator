name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build EXE
        run: .\build.bat
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI-Mesh-Generator-Windows
          path: dist/AI-Mesh-Generator.exe
