name: Build AI Mesh Generator EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AI-Mesh-Generator app\main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI-Mesh-Generator-Windows
          path: dist\AI-Mesh-Generator.exe
          if-no-files-found: error
